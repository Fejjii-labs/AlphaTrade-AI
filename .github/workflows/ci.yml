name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      full_backend:
        description: Run the complete backend suite for final release acceptance
        type: boolean
        required: true
        default: false
      e2e_smoke:
        description: Run the non-blocking Chromium smoke suite
        type: boolean
        default: false

# A newer PR commit cancels the older PR run. Manual dispatches never cancel
# each other (or a PR run): each keeps its own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CI_SCOPE_EVENT_NAME: ${{ github.event_name }}
  CI_SCOPE_PR_ACTION: ${{ github.event.action }}
  CI_SCOPE_PR_DRAFT: ${{ github.event.pull_request.draft }}
  CI_SCOPE_PR_LABEL: ${{ github.event.label.name }}
  CI_SCOPE_PR_LABELS: ${{ github.event_name == 'pull_request' && join(github.event.pull_request.labels.*.name, ',') || '' }}
  CI_SCOPE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
  CI_SCOPE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CI_SCOPE_PR_NUMBER: ${{ github.event.pull_request.number }}
  CI_SCOPE_BASE_CHANGED: ${{ github.event.changes.base.ref.from && 'true' || 'false' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      frontend: ${{ steps.paths.outputs.frontend }}
      evaluation: ${{ steps.paths.outputs.evaluation }}
      docker: ${{ steps.paths.outputs.docker }}
      deployment: ${{ steps.paths.outputs.deployment }}
      full_backend: ${{ steps.paths.outputs.full_backend }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide CI scope
        id: scope
        working-directory: ${{ github.workspace }}
        run: bash .github/workflows/ci-scope.sh
      - name: Select checks by path
        id: paths
        working-directory: ${{ github.workspace }}
        env:
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          RUN_HEAVY: ${{ steps.scope.outputs.heavy }}
          RUN_APP: ${{ steps.scope.outputs.app }}
          DISPATCH_FULL: ${{ inputs.full_backend }}
        run: |
          backend=true frontend=true evaluation=true docker=true deployment=true full_backend=false
          if [[ "$CI_SCOPE_EVENT_NAME" == workflow_dispatch ]]; then
            full_backend="$DISPATCH_FULL"
          else
            # The Full-Backend trailer records a local full run (docs/ci-local.md).
            # It never starts the hosted backend-full job; only dispatch does.
            # A failed diff leaves all checks enabled.
            if paths=$(git diff --name-only --no-renames "$CI_SCOPE_BASE_SHA...$CI_SCOPE_HEAD_SHA"); then
              backend=false frontend=false evaluation=false docker=false deployment=false
              while IFS= read -r path; do
                case "$path" in
                  .github/workflows/*|Makefile|scripts/ci-local.sh)
                    backend=true frontend=true evaluation=true docker=true deployment=true ;;
                  backend/*)
                    backend=true frontend=true evaluation=true docker=true deployment=true ;;
                  frontend/Dockerfile|frontend/vercel.json|frontend/.env.*) frontend=true deployment=true ;;
                  frontend/*) frontend=true ;;
                  evaluation/*) evaluation=true ;;
                  scripts/run_backend_focused.py) backend=true ;;
                  scripts/*|deploy/*|render.yaml|docker-compose.yml|.env*) deployment=true ;;
                esac
              done <<< "$paths"
            fi
            if [[ "$RUN_HEAVY" == false ]]; then
              backend=false evaluation=false docker=false
            fi
            if [[ "$RUN_APP" == false ]]; then frontend=false; fi
            if [[ "$RUN_HEAVY" == false && "$PR_DRAFT" == true ]]; then frontend=false; fi
          fi
          for check in backend frontend evaluation docker deployment full_backend; do
            printf '%s=%s\n' "$check" "${!check}" >> "$GITHUB_OUTPUT"
          done
      - uses: astral-sh/setup-uv@v5
        if: steps.paths.outputs.backend == 'true'
        with:
          enable-cache: true
      - name: Install dependencies
        if: steps.paths.outputs.backend == 'true'
        run: uv sync --locked --extra dev
      - name: Ruff check
        if: steps.paths.outputs.backend == 'true'
        run: uv run ruff check . ../scripts/run_backend_focused.py
      - name: Ruff format
        if: steps.paths.outputs.backend == 'true'
        run: uv run ruff format --check . ../scripts/run_backend_focused.py
      - name: Focused backend development tests
        if: steps.paths.outputs.backend == 'true'
        env:
          # Persistence fixtures are exercised by backend-full.
          CI: "false"
        run: |
          base=""
          if [[ -n "$CI_SCOPE_BASE_SHA" ]]; then
            base=$(git merge-base "$CI_SCOPE_BASE_SHA" "$CI_SCOPE_HEAD_SHA")
          fi
          uv run python ../scripts/run_backend_focused.py --base "$base" --head "$CI_SCOPE_HEAD_SHA"

  backend-full:
    needs: backend
    if: always() && !cancelled() && needs.backend.outputs.full_backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: alphatrade
          POSTGRES_PASSWORD: alphatrade
          POSTGRES_DB: alphatrade_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alphatrade -d alphatrade_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AT028_POSTGRES_URL: postgresql+psycopg://alphatrade:alphatrade@localhost:5432/alphatrade_test
      # Same disposable database. These names are what the PR249 Postgres
      # fixtures require before they will execute in the full gate.
      EXPERIMENT_TEST_POSTGRES_URL: postgresql+psycopg://alphatrade:alphatrade@localhost:5432/alphatrade_test
      BLOFIN_ACTIVITY_TEST_POSTGRES_URL: postgresql+psycopg://alphatrade:alphatrade@localhost:5432/alphatrade_test
      PR237_ROLLBACK_POSTGRES_URL: postgresql+psycopg://alphatrade:alphatrade@localhost:5432/alphatrade_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Ruff check and format
        run: |
          uv run ruff check . ../scripts/run_backend_focused.py
          uv run ruff format --check . ../scripts/run_backend_focused.py
      - name: Complete backend release acceptance
        # bash -e does not fail a pipeline when pytest fails and tee succeeds.
        shell: bash -eo pipefail {0}
        run: uv run pytest -o addopts= --timeout=300 --timeout-method=thread -rfE --durations=50 --junitxml=full-backend-junit.xml | tee full-backend-pytest.log
      - name: Upload full backend pytest artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-backend-pytest
          path: |
            backend/full-backend-junit.xml
            backend/full-backend-pytest.log
          if-no-files-found: warn

  deployment-safety:
    needs: backend
    if: always() && !cancelled() && needs.backend.outputs.deployment != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: CI scope self-test
        working-directory: ${{ github.workspace }}
        run: bash .github/workflows/ci-scope.sh --self-test
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Deployment safety tests
        run: uv run pytest tests/test_deployment_safety.py tests/test_deployment_scripts.py tests/test_config.py tests/test_watcher_paper_activation.py -q
      - name: Deployment scripts are executable
        working-directory: .
        run: |
          test -x scripts/check-env.sh
          test -x scripts/verify-safety.sh
          test -x scripts/staging-smoke.sh
          test -x scripts/staging-live-smoke.sh
          test -x scripts/post-deploy-smoke-gate.sh
          test -x scripts/canonical-staging-smoke.sh
          test -x scripts/validate-live-market-staging.sh
          test -x scripts/telegram-paper-activation-preflight.sh
          test -x scripts/telegram-paper-activation-smoke.sh
          test -x scripts/telegram-paper-activation-rollback.sh
          test -x scripts/controlled-paper-activation-rollback.sh
          test -x scripts/run-migrations.sh
          test -x scripts/watcher-paper-rollback.sh
          test -x scripts/watcher-paper-activation-smoke.sh
          test -x scripts/lib/watcher_paper_health.py
      - name: Post-deploy smoke gate self-check
        working-directory: .
        run: ./scripts/post-deploy-smoke-gate.sh --self-check
      - name: Canonical staging smoke self-check
        working-directory: .
        run: ./scripts/canonical-staging-smoke.sh --self-check
      - name: Live market staging validation self-check
        working-directory: .
        run: ./scripts/validate-live-market-staging.sh --self-check
      - name: Watcher paper activation self-checks
        working-directory: .
        run: |
          ./scripts/watcher-paper-rollback.sh --self-check
          ./scripts/watcher-paper-activation-smoke.sh --self-check
          python3 scripts/lib/watcher_paper_health.py --self-check
      - name: Watcher paper activation module self-check
        working-directory: backend
        run: uv run python -m app.workers.watcher_activation --self-check
      - name: Telegram paper activation stays disarmed by default
        working-directory: .
        run: ./scripts/telegram-paper-activation-preflight.sh
      - name: Controlled paper activation rollback self-check
        working-directory: .
        run: |
          ./scripts/controlled-paper-activation-rollback.sh --self-check
          set +e
          ./scripts/controlled-paper-activation-rollback.sh --apply
          code=$?
          set -e
          test "$code" -eq 2

  frontend:
    needs: backend
    if: always() && !cancelled() && needs.backend.outputs.frontend != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      # The generated contract is exported from the backend, so drift from
      # either side fails here. The exporter runs uv --offline --frozen.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install backend for the API contract export
        working-directory: backend
        run: UV_CACHE_DIR=/tmp/reviewer-uv-cache uv sync --locked
      - name: API contract drift check
        run: npm run api:check
      - name: Build
        run: npm run build

  evaluation:
    needs: backend
    if: needs.backend.outputs.evaluation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install backend
        working-directory: backend
        run: uv sync --extra dev
      - name: Evaluate agent
        working-directory: backend
        run: uv run python ../evaluation/evaluate_agent.py
      - name: Evaluate RAG
        working-directory: backend
        run: uv run python ../evaluation/evaluate_rag.py
      - name: Evaluate guardrails
        working-directory: backend
        run: uv run python ../evaluation/evaluate_guardrails.py

  docker-build:
    needs: backend
    if: always() && !cancelled() && needs.backend.outputs.docker != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build backend Docker image
        run: docker build -t alphatrade-backend:ci ./backend

  e2e-smoke:
    # ubuntu-latest moved to 26.04 (2026-11-04); Playwright chromium install is unsupported there.
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' && inputs.e2e_smoke
    timeout-minutes: 45
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: uv sync --extra dev
      - name: Install frontend
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
      - name: E2E smoke (API + public UI)
        env:
          CI: "true"
        run: npm run test:e2e
      - name: Upload failed Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-test-results
          path: frontend/test-results/
          if-no-files-found: ignore
